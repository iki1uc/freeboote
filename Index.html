  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{height:100%;overflow:hidden;background:#000;}
  body{color:var(--fg);font-family:var(--mono);font-size:12px;}
  .freeboote-root{width:100vw;height:100vh;overflow:hidden;position:relative;background:#000;color:var(--fg);font-family:var(--mono);font-size:12px;}

  #desk::before{

      radial-gradient(ellipse at 30% 30%,rgba(255,170,51,0.06) 0%,transparent 45%),
      radial-gradient(ellipse at 70% 70%,rgba(255,102,255,0.05) 0%,transparent 45%),
      radial-gradient(ellipse at 50% 50%,rgba(124,224,168,0.04) 0%,transparent 60%);
    animation:bgBreathe 8s ease-in-out infinite;
  }
  @keyframes bgBreathe{
    0%,100%{transform:scale(1);opacity:.6;}
    50%{transform:scale(1.08);opacity:1;}
  }
  #topbar{
    height:34px;background:linear-gradient(180deg,#06101c,#02060a);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;padding:0 14px;
    font-size:11px;letter-spacing:1px;gap:12px;
    flex-shrink:0;position:relative;z-index:5;
  }
  #topbar .logo{
    color:var(--co2);font-weight:bold;letter-spacing:3px;
    font-family:var(--serif);text-shadow:0 0 10px var(--co2);
    display:flex;align-items:center;gap:8px;
  }
  #topbar .logo b{color:var(--wrap);text-shadow:0 0 10px var(--wrap);}
  #topbar .eye{
    display:inline-block;width:10px;height:10px;border-radius:50%;
    background:var(--co2);box-shadow:0 0 12px var(--co2);
    animation:eyePulse 3s ease-in-out infinite;
  }
  @keyframes eyePulse{
    0%,100%{transform:scale(0.9);box-shadow:0 0 8px var(--co2);}
    50%{transform:scale(1.4);box-shadow:0 0 22px var(--co2),0 0 44px rgba(255,204,68,.5);}
  }
  #topbar .sep{width:1px;height:18px;background:var(--line);}
  #topbar .path{color:var(--dim);font-size:10px;letter-spacing:2px;}
  #topbar .stat{
    color:var(--dim);font-size:10px;display:flex;gap:12px;
    margin-left:auto;align-items:center;flex-wrap:wrap;
  }
  #topbar .stat b{font-weight:bold;}
  #topbar .stat b.o2{color:var(--o2);}
  #topbar .stat b.co2{color:var(--co2);text-shadow:0 0 6px var(--co2);}
  #topbar .stat b.h2o{color:var(--h2o);}
  #topbar .stat b.atom{color:var(--atom);}
  #topbar .stat b.wrap{color:var(--wrap);text-shadow:0 0 6px var(--wrap);}
  #topbar #clock{color:var(--h2o);}

  #main{
    flex:1;display:grid;
    grid-template-columns: 320px 1fr 320px;
    overflow:hidden;min-height:0;position:relative;z-index:2;
  }
  @media(max-width:1280px){#main{grid-template-columns:1fr 1fr;}}
  @media(max-width:840px){#main{grid-template-columns:1fr;}}

  #leftCol,#centerCol,#rightCol{
    display:flex;flex-direction:column;overflow-y:auto;min-height:0;
  }
  #leftCol::-webkit-scrollbar,#centerCol::-webkit-scrollbar,#rightCol::-webkit-scrollbar{width:6px;}
  #leftCol::-webkit-scrollbar-thumb,#centerCol::-webkit-scrollbar-thumb,#rightCol::-webkit-scrollbar-thumb{background:var(--line);}

  .panel{
    background:rgba(6,16,28,0.85);

  .panel:last-child{margin-bottom:8px;}

  .badge.h2o{background:rgba(95,200,255,0.12);color:var(--h2o);}
  .badge.atom{background:rgba(179,136,255,0.12);color:var(--atom);}
  .badge.warn{background:rgba(255,204,68,0.1);color:var(--warn);}
  .badge.err{background:rgba(255,90,122,0.1);color:var(--err);}

  #co2Panel{
    background:
      radial-gradient(ellipse at 50% 60%,rgba(255,204,68,0.10) 0%,transparent 60%),
      rgba(6,16,28,0.9);

  #co2Panel .content{position:relative;z-index:1;}

  .creature-head{display:flex;align-items:center;gap:12px;padding:4px 0 10px;border-bottom:1px dashed var(--line2);margin-bottom:10px;}
  .creature-avatar{

    background:radial-gradient(circle at 35% 30%,#fff4c8 0%,#ffcc44 30%,#ff8a2a 60%,#4a1e08 100%);
    box-shadow:0 0 20px rgba(255,204,68,0.7),0 0 40px rgba(255,204,68,0.4),inset 0 0 15px rgba(255,255,255,0.4);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;font-family:var(--serif);font-weight:bold;
    color:#3a1a04;text-shadow:0 0 8px rgba(255,255,255,0.6);

  }
  @keyframes creatureBreathe{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }
  .creature-avatar::after{
    content:'';position:absolute;inset:-6px;border-radius:50%;
    border:1px solid rgba(255,204,68,0.4);
    animation:orbit 8s linear infinite;
  }
  @keyframes orbit{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
  .creature-meta{flex:1;min-width:0;}
  .creature-name{
    font-family:var(--serif);font-size:15px;font-weight:bold;
    color:var(--co2);letter-spacing:2px;text-shadow:0 0 8px var(--co2);
  }
  .creature-title{font-size:9.5px;color:var(--dim);letter-spacing:1.5px;margin-top:2px;}
  .creature-mood{
    display:inline-block;margin-top:6px;padding:2px 8px;
    border:1px solid var(--co2);border-radius:10px;
    font-size:9px;color:var(--co2);background:rgba(255,204,68,0.08);
    letter-spacing:1px;transition:all 0.4s;
  }
  .creature-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
  .cstat{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--co2);border-radius:4px;padding:6px 8px;}
  .cstat .k{font-size:8.5px;color:var(--dim);letter-spacing:1px;font-weight:bold;}
  .cstat .v{font-size:14px;color:var(--co2);font-weight:bold;margin-top:2px;font-variant-numeric:tabular-nums;}
  .cstat .bar{height:3px;background:#0a1420;border-radius:2px;overflow:hidden;margin-top:4px;}
  .cstat .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3a1e08,var(--co2));box-shadow:0 0 6px var(--co2);transition:width 0.5s;}

  .dialogue{
    background:#02060a;border:1px solid rgba(255,204,68,0.2);
    border-radius:6px;padding:10px 12px;

  .mbtn.co2:hover{background:rgba(255,204,68,0.15);color:#fff;}
  .mbtn.wrap{border-color:rgba(255,102,255,0.4);color:var(--wrap);}
  .mbtn.wrap:hover{background:rgba(255,102,255,0.15);color:#fff;}
  .btn-row{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}

  .axiom-cell .l{font-size:8px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
  .axiom-cell.c3{border-left:3px solid var(--o2);} .axiom-cell.c3 .v{color:var(--o2);text-shadow:0 0 8px var(--o2);}
  .axiom-cell.c9{border-left:3px solid var(--h2o);} .axiom-cell.c9 .v{color:var(--h2o);text-shadow:0 0 8px var(--h2o);}
  .axiom-cell.c81{border-left:3px solid var(--co2);} .axiom-cell.c81 .v{color:var(--co2);text-shadow:0 0 8px var(--co2);}
  .axiom-cell.c243{border-left:3px solid var(--wrap);} .axiom-cell.c243 .v{color:var(--wrap);text-shadow:0 0 8px var(--wrap);}

  .meter-row{display:grid;grid-template-columns:80px 1fr 55px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line2);font-size:10.5px;}
  .meter-row:last-child{border-bottom:none;}
  .meter-row .k{color:var(--dim);font-size:9.5px;letter-spacing:1px;font-weight:bold;}
  .meter-row .bar{height:6px;background:var(--bg3);border-radius:2px;overflow:hidden;}
  .meter-row .bar i{display:block;height:100%;width:0;transition:width 0.5s;}
  .meter-row .v{text-align:right;font-weight:bold;font-size:10px;font-variant-numeric:tabular-nums;}

  #cli{
    height:150px;background:#02060a;
    border-top:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0;
    position:relative;z-index:5;
  }
  #cliHdr{
    height:22px;background:var(--bg2);border-bottom:1px solid var(--line);
    display:flex;align-items:center;padding:0 12px;
    font-size:9px;letter-spacing:1.5px;color:var(--dim);
    text-transform:uppercase;gap:12px;
  }
  #cliHdr .tag{margin-left:auto;color:var(--co2);font-size:9px;letter-spacing:1px;display:flex;align-items:center;gap:5px;}
  #cliHdr .tag .led{width:6px;height:6px;border-radius:50%;background:var(--co2);box-shadow:0 0 6px var(--co2);animation:eyePulse 3s ease-in-out infinite;}
  #log{flex:1;padding:6px 12px;overflow-y:auto;font-size:10.5px;line-height:1.5;color:var(--dim);font-family:var(--mono);}
  #log::-webkit-scrollbar{width:6px;} #log::-webkit-scrollbar-thumb{background:var(--line);}
  #log .ln{white-space:pre-wrap;word-break:break-all;}
  #log .ts{color:var(--dim2);margin-right:6px;}
  #log .co2{color:var(--co2);font-weight:bold;}
  #log .wrap{color:var(--wrap);font-weight:bold;}
  #log .ok{color:var(--ok);}
  #log .warn{color:var(--warn);}
  #log .err{color:var(--err);}
  #log .info{color:var(--h2o);}
  #log .ohrwurm{color:var(--wrap);font-weight:bold;letter-spacing:2px;}

  #cliInput{height:26px;background:var(--bg3);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 12px;font-size:11px;flex-shrink:0;}
  #cliInput .prompt{color:var(--co2);margin-right:6px;font-weight:bold;text-shadow:0 0 6px var(--co2);}
  #cliInput input{flex:1;background:transparent;border:none;color:var(--fg);font-family:var(--mono);font-size:11px;outline:none;}
  #cliInput input::placeholder{color:var(--dim2);}

  #boot{
    position:fixed;inset:0;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;z-index:9999;font-size:12px;color:var(--co2);
    letter-spacing:2px;transition:opacity 0.7s;
  }
  #boot.done{opacity:0;pointer-events:none;}
  #boot .logo{
    font-size:48px;color:var(--co2);letter-spacing:14px;font-weight:bold;
    text-shadow:0 0 30px rgba(255,204,68,0.8),0 0 60px rgba(255,102,255,0.6);
    animation:logoBreathe 4s ease-in-out infinite;font-family:var(--serif);
  }
  @keyframes logoBreathe{
    0%,100%{transform:scale(1);filter:brightness(1);}
    50%{transform:scale(1.04);filter:brightness(1.35);}
  }
  #boot .sub{color:var(--wrap);font-size:11px;letter-spacing:8px;font-family:var(--serif);text-shadow:0 0 12px var(--wrap);}
  #boot .lines{width:640px;max-width:86%;font-size:11px;line-height:1.7;text-align:left;color:var(--co2);letter-spacing:0.5px;}
  #boot .lines b{color:var(--wrap);}
  #boot .lines .dim{color:var(--dim2);}
  #boot .lines .atom{color:var(--atom);}
  #boot .lines .h2o{color:var(--h2o);}
  #boot .ohrwurm{
    margin-top:14px;padding:16px 24px;
    background:rgba(255,102,255,0.08);
    border:1px solid var(--wrap);border-radius:6px;
    font-size:14px;letter-spacing:2px;color:var(--wrap);
    text-shadow:0 0 12px var(--wrap);text-align:center;
    animation:ohrwurmPulse 0.6s ease-in-out infinite;
  }
  @keyframes ohrwurmPulse{
    0%,100%{opacity:0.75;transform:scale(1);}
    50%{opacity:1;transform:scale(1.02);}
  }
  #boot .progress{width:640px;max-width:86%;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;}
  #boot .progress .bar{height:100%;width:0%;background:linear-gradient(90deg,var(--co2),var(--wrap),var(--o2),var(--atom));transition:width 0.3s;}
  #videoPanel{position:relative;overflow:hidden;}
  #videoPanel .vid-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden;border:1px solid var(--line);}
  #videoPanel iframe{width:100%;height:100%;border:0;display:block;}
  #videoPanel .vid-meta{margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:9px;color:var(--dim);letter-spacing:1px;}
  #videoPanel .vid-meta b{color:var(--co2);}
  #videoPanel .vid-meta .ytlink{color:var(--wrap);text-decoration:none;border:1px solid rgba(255,102,255,0.2);padding:2px 6px;border-radius:3px;}
  #videoPanel .vid-meta .ytlink:hover{background:rgba(255,102,255,0.12);}
